# Nginx Reverse Proxy Configuration for OSAP (OmniShorts Auto-Publisher)
# Tempatkan file ini di /etc/nginx/sites-available/osap
# lalu buat symlink ke /etc/nginx/sites-enabled/osap:
# sudo ln -s /etc/nginx/sites-available/osap /etc/nginx/sites-enabled/
# sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name your-domain.com; # Ganti dengan domain server lo

    # Redirect HTTP ke HTTPS (Aktifkan jika sudah pasang SSL)
    # return 301 https://$host$request_uri;

    client_max_body_size 500M;

    location / {
        proxy_pass http://127.0.0.1:8085;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeout settings untuk upload file besar
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Konfigurasi khusus Live Logs (SSE / EventSource) agar tidak ter-buffer
    location /api/logs/stream {
        proxy_pass http://127.0.0.1:8085/api/logs/stream;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
        chunked_transfer_encoding off;
    }
}

