services:
  osap:
    build: .
    container_name: osap_bot
    restart: unless-stopped
    shm_size: '2gb'
    ports:
      - "${HOST_PORT:-8085}:8080"
    environment:
      - OSAP_DB_PATH=/app/data/osap.db
      - DOWNLOAD_DIR=/app/downloads
      - ASSETS_DIR=/app/assets
      - PROFILES_DIR=/app/assets/profiles
      - HEADLESS=true
    volumes:
      # Persist database, downloads, profiles, and config
      - ./data:/app/data
      - ./downloads:/app/downloads
      - ./assets:/app/assets
      - ./config.yaml:/app/config.yaml
      - ./.env:/app/.env
      # Live code sync (so git pull takes effect on restart without rebuild)
      - ./web:/app/web
      - ./osap:/app/osap
      - ./manage.py:/app/manage.py
